name: integration
on:
  pull_request:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dataplane/go.mod
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y nftables iperf3
      - run: make build
      - name: end-to-end in network namespaces
        run: sudo --preserve-env=PATH ./lab/e2e.sh