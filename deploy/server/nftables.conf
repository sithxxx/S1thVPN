table inet sibtunnel {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept 
        ct state invalid drop 
        iifname "lo" accept 
        meta l4proto { icmp, ipv6-icmp } limit rate 20/second accept 
        tcp dport $SSH_PORT ct state new limit rate 10/minute accept 
        udp dport { $OWN_PORT, $WG_PORT } accept 
        tcp dport { 80, 443 } accept 
        iifname { $TUN, $WG } udp dport 53 accept 
        iifname { $TUN, $WG } tcp dport 53 accept 
    }
    chain forward {
        tcp flags syn tcp option maxseg size set rt mtu 
        ct state established,related accept 
        ct state invalid drop 
        iifname { $TUN, $WG } oifname { $TUN, $WG } drop comment "клиенты не видят друг друга"
        iifname {TUN, $WG } tcp dport 25 drop comment "без спама с нашего IP"
        iifname $TUN ip saddr $OWN_NET oifname $WAN accept 
        iifname $WG ip saddr $WG_NET oifname $WAN accept 
    }
}

table ip sibtunnel_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr { $OWN_NET, $WG_NET } masquerade 
    }
}